services:
  vllm-server:
    image: vllm/vllm-openai:v0.8.5
    container_name: vllm-node
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - HF_TOKEN=${HF_TOKEN}
      - HF_HUB_ENABLE_HF_TRANSFER=1
      - HF_DEBUG=1
      # - HF_ENDPOINT=https://hf-mirror.com
      # - HTTP_PROXY=http://nginx:80
      # - HTTPS_PROXY=http://nginx:80
      - NO_PROXY=localhost,127.0.0.1,.local,.abc8888.ru,172.0.0.0/8
      # - VLLM_USE_MODELSCOPE=True
      # Игнорируем прокси для HuggingFace
      - NO_PROXY=huggingface.co,cdn-lfs.huggingface.co,.huggingface.co
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    ports:
      - "8000:8000"
    volumes:
      - /mnt/hdd_data/volumes/vllm_node/models:/root/.cache/huggingface
      - /mnt/hdd_data/volumes/vllm_node/lora_adapters:/app/lora
    networks:
      vllm_network:
        ipv4_address: ${IP_VLLM}
    command: >
      --model unsloth/Qwen2.5-7B-Instruct-bnb-4bit
      --quantization bitsandbytes
      --load-format bitsandbytes
      --enable-lora
      --max-loras 2
      --lora-modules
        translator=/app/lora/qwen3-translator
        analyzer=/app/lora/qwen3-analyzer
      --gpu-memory-utilization 0.90
      --max-model-len 2048
      --max-num-seqs 16
      --trust-remote-code
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

networks:
  vllm_network:
    name: vllm_network
    driver: bridge
    ipam:
      config:
        - subnet: ${SUBNET_VLLM}
