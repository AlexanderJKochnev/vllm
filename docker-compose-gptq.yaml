services:
  vllm-server:
    image: vllm:local
    # image: vllm/vllm-openai:v0.8.5
    container_name: vllm-node
    runtime: nvidia
    environment:
      - VLLM_USE_MODELSCOPE=true
      - VLLM_USE_V1=0
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - NVIDIA_VISIBLE_DEVICES=all
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - HF_TOKEN=${HF_TOKEN}
      # - HF_HUB_ENABLE_HF_TRANSFER=1
      - HF_DEBUG=1
      - HF_ENDPOINT=https://hf-mirror.com
      # - HTTP_PROXY=http://nginx:80
      # - HTTPS_PROXY=http://nginx:80
      - NO_PROXY=localhost,127.0.0.1,.local,.abc8888.ru,172.0.0.0/8
      # - VLLM_USE_MODELSCOPE=True
      # Игнорируем прокси для HuggingFace
      - NO_PROXY=huggingface.co,cdn-lfs.huggingface.co,.huggingface.co
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    ports:
      - "8000:8000"
    volumes:
      # - /mnt/hdd_data/volumes/vllm_node/models:/root/.cache/huggingface
      # - ${BIND_VOLUMES}/vllm_node/models/Qwen2.5-7B-GPTQ:/model
      # - ${BIND_VOLUMES}/vllm_node/models/Qwen2.5-7B-Instruct-GPTQ-Int8:/model
      - ${BIND_VOLUMES}/vllm_node/models/Qwen2.5-7B-AWQ:/model
      # - ${BIND_VOLUMES}/vllm_node/models/Mistral-Nemo-4bit:/model
      # - ${BIND_VOLUMES}/vllm_node/lora_adapters:/app/lora
    networks:
      vllm_network:
        ipv4_address: ${IP_VLLM}
    command: >
      --model /model
      --quantization gptq
      --dtype half
      --gpu-memory-utilization 0.85
      --max-model-len 8192
      --enable-prefix-caching
      --max-num-seqs 4
      --enforce-eager
      --disable-log-requests
      --disable-log-stats
      --trust-remote-code
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

networks:
  vllm_network:
    name: vllm_network
    driver: bridge
    external: true
